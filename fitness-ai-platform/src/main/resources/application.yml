spring:
  application:
    name: fitness-ai-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
    expiration: ${JWT_EXPIRATION:7200}

storage:
  local:
    root: ${STORAGE_ROOT:./uploads}
    public-prefix: ${STORAGE_PUBLIC_PREFIX:/files}

ai:
  openai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    temperature: ${AI_TEMPERATURE:0.2}
  rag:
    max-results: ${AI_RAG_MAX_RESULTS:5}
    min-score: ${AI_RAG_MIN_SCORE:0.65}

server:
  port: ${SERVER_PORT:8080}
